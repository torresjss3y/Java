spring.application.name=demo-app

# ==================================
# DATABASE CONFIGURATION
# ==================================
spring.datasource.url=jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres?user=postgres.yqwxoyiblfnwxvgzcygr&password=JavaApp@ucss&sslmode=require
spring.datasource.driver-class-name=org.postgresql.Driver

# ==================================
# JPA CONFIGURATION
# ==================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==================================
# DEVTOOLS CONFIGURATION
# ==================================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.additional-paths=src/main/java,src/main/resources
spring.devtools.restart.exclude=static/**,public/**,META-INF/maven/**

# ==================================
# THYMELEAF CONFIGURATION
# ==================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=true
spring.thymeleaf.reactive.max-chunk-size=8192

# ==================================
# STATIC RESOURCES CONFIGURATION
# ==================================
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=0
spring.web.resources.cache.cachecontrol.max-age=0
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.cache.cachecontrol.must-revalidate=true

# ==================================
# HTTP ENCODING
# ==================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force-response=true

# ==================================
# LOGGING - SOLO INFORMACIÓN ESENCIAL
# ==================================
# Nivel INFO para producción (solo muestra información importante)
logging.level.root=INFO
logging.level.com.project.app=INFO

# Solo muestra errores de Spring
logging.level.org.springframework=WARN
logging.level.org.springframework.web=WARN
logging.level.org.thymeleaf=WARN
logging.level.org.springframework.boot.devtools=WARN

# JPA - solo muestra las consultas SQL
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF

# Desactiva logs innecesarios
logging.level.org.apache.catalina=OFF
logging.level.org.apache.tomcat=OFF