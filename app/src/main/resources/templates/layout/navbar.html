<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<nav th:fragment="navbar" class="fixed top-0 z-50 w-full bg-white/90 dark:bg-slate-800/90 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-700/80 shadow-xs">
  <div class="px-4 py-3 lg:px-6">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button data-drawer-target="logo-sidebar" data-drawer-toggle="logo-sidebar" aria-controls="logo-sidebar" type="button" class="inline-flex items-center p-2 text-slate-500 rounded-xl lg:hidden hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-violet-500 dark:text-slate-400 dark:hover:bg-slate-700">
            <span class="sr-only">Abrir menú</span>
            <i class="fa-solid fa-bars text-lg"></i>
        </button>
        <a th:href="@{/}" class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-violet-600 via-indigo-600 to-blue-500 flex items-center justify-center text-white shadow-md shadow-violet-500/25">
            <i class="fa-solid fa-bolt text-lg"></i>
          </div>
          <span class="self-center text-xl font-extrabold bg-gradient-to-r from-violet-600 via-indigo-600 to-blue-600 bg-clip-text text-transparent dark:from-violet-400 dark:to-blue-400">
            Nexus
          </span>
        </a>
      </div>

      <div class="flex items-center gap-2.5">
          <button type="button" data-dropdown-toggle="notification-dropdown" class="relative p-2 text-slate-500 rounded-xl hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-700 transition-colors">
              <span class="sr-only">Ver notificaciones</span>
              <i class="fa-regular fa-bell text-lg"></i>
              <span class="absolute top-1 right-1 w-2 h-2 bg-rose-500 rounded-full ring-2 ring-white dark:ring-slate-800"></span>
          </button>

          <div class="hidden z-50 my-4 max-w-sm text-base list-none bg-white dark:bg-slate-800 rounded-2xl divide-y divide-slate-100 dark:divide-slate-700 shadow-xl border border-slate-100 dark:border-slate-700" id="notification-dropdown">
              <div class="block py-3 px-4 text-sm font-bold text-slate-700 dark:text-slate-200 bg-slate-50/50 dark:bg-slate-800/50 rounded-t-2xl">
                  Notificaciones
              </div>
              <div class="divide-y divide-slate-100 dark:divide-slate-700/50">
                  <a href="#" class="flex py-3 px-4 hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors">
                      <div class="flex-shrink-0">
                          <div class="w-9 h-9 rounded-full bg-violet-100 dark:bg-violet-900/40 text-violet-600 dark:text-violet-400 font-bold text-xs flex items-center justify-center">
                              BG
                          </div>
                      </div>
                      <div class="ml-3">
                          <p class="text-xs text-slate-600 dark:text-slate-300">
                              <span class="font-semibold text-slate-800 dark:text-white">Bonnie Green</span> te envió un mensaje
                          </p>
                          <p class="text-[10px] text-slate-400 mt-0.5">hace 5 min</p>
                      </div>
                  </a>
              </div>
          </div>

          <button id="theme-toggle" class="p-2 text-slate-500 rounded-xl hover:bg-slate-100 dark:text-slate-400 dark:hover:bg-slate-700 transition-colors">
              <i id="theme-icon" class="fa-regular fa-moon text-lg"></i>
          </button>

          <div class="flex items-center ms-1">
            <button type="button" class="flex text-sm rounded-full focus:ring-4 focus:ring-violet-500/20 transition-transform active:scale-95" aria-expanded="false" data-dropdown-toggle="dropdown-user">
              <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-violet-600 to-indigo-600 text-white font-bold text-xs flex items-center justify-center ring-2 ring-violet-500/30 shadow-xs">
                NS
              </div>
            </button>
            
            <div class="z-50 hidden my-4 text-base list-none bg-white dark:bg-slate-800 divide-y divide-slate-100 dark:divide-slate-700 rounded-2xl shadow-xl border border-slate-100 dark:border-slate-700 overflow-hidden w-56" id="dropdown-user">
              <div class="px-4 py-3 bg-slate-50/50 dark:bg-slate-800/50">
                <p class="text-sm font-semibold text-slate-900 dark:text-white">Neil Sims</p>
                <p class="text-xs font-medium text-slate-500 truncate dark:text-slate-400">neil.sims@flowbite.com</p>
              </div>
              <ul class="py-1 text-sm text-slate-700 dark:text-slate-300">
                <li><a href="#" class="flex items-center gap-2 px-4 py-2 hover:bg-violet-50 dark:hover:bg-slate-700 hover:text-violet-600 dark:hover:text-violet-400 transition-colors"><i class="fa-regular fa-user w-4"></i> Perfil</a></li>
                <li><a href="#" class="flex items-center gap-2 px-4 py-2 hover:bg-violet-50 dark:hover:bg-slate-700 hover:text-violet-600 dark:hover:text-violet-400 transition-colors"><i class="fa-solid fa-sliders w-4"></i> Configuración</a></li>
              </ul>
              <div class="py-1">
                <a href="#" class="flex items-center gap-2 px-4 py-2 text-sm text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/30 transition-colors"><i class="fa-solid fa-arrow-right-from-bracket w-4"></i> Cerrar sesión</a>
              </div>
            </div>
          </div>
      </div>
    </div>
  </div>
</nav>

</body>
</html>
