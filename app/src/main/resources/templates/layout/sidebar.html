<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<aside th:fragment="sidebar" id="logo-sidebar" class="fixed top-0 left-0 z-40 w-64 h-screen pt-20 transition-transform -translate-x-full bg-white dark:bg-slate-800 border-r border-slate-200/80 dark:border-slate-700/80 lg:translate-x-0" aria-label="Sidebar">
   <div class="h-full px-4 pb-6 overflow-y-auto flex flex-col justify-between">
      
      <div class="space-y-6">
        <div>
          <p class="px-3 text-[11px] font-bold tracking-wider text-slate-400 uppercase dark:text-slate-500 mb-2">Menú Principal</p>
          <ul class="space-y-1.5 font-medium">
             
             <li>
                <a th:href="@{/}" class="flex items-center p-2 text-violet-700 bg-violet-50 dark:bg-violet-950/40 dark:text-violet-300 rounded-xl transition-all font-semibold shadow-xs">
                   <div class="w-8 h-8 rounded-lg bg-violet-600 text-white flex items-center justify-center text-xs shadow-sm shadow-violet-500/30">
                     <i class="fa-solid fa-chart-pie"></i>
                   </div>
                   <span class="ms-3 text-sm">Dashboard</span>
                </a>
             </li>

             <li>
                <a th:href="@{/usuarios}" class="flex items-center p-2 text-slate-600 dark:text-slate-300 rounded-xl hover:bg-slate-100/80 dark:hover:bg-slate-700/50 transition-all group">
                   <div class="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 dark:bg-blue-950/50 dark:text-blue-400 flex items-center justify-center text-xs group-hover:scale-110 group-hover:bg-blue-600 group-hover:text-white transition-all">
                     <i class="fa-solid fa-layer-group"></i>
                   </div>
                   <span class="flex-1 ms-3 text-sm whitespace-nowrap">Tablero Kanban</span>
                   <span class="px-2 py-0.5 text-[10px] font-bold text-blue-700 bg-blue-100 dark:bg-blue-900/50 dark:text-blue-300 rounded-full">Pro</span>
                </a>
             </li>

             <li>
                <a href="#" class="flex items-center p-2 text-slate-600 dark:text-slate-300 rounded-xl hover:bg-slate-100/80 dark:hover:bg-slate-700/50 transition-all group">
                   <div class="w-8 h-8 rounded-lg bg-emerald-50 text-emerald-600 dark:bg-emerald-950/50 dark:text-emerald-400 flex items-center justify-center text-xs group-hover:scale-110 group-hover:bg-emerald-600 group-hover:text-white transition-all">
                     <i class="fa-solid fa-envelope"></i>
                   </div>
                   <span class="flex-1 ms-3 text-sm whitespace-nowrap">Mensajes</span>
                   <span class="inline-flex items-center justify-center px-2 py-0.5 text-[10px] font-bold text-white bg-emerald-500 rounded-full">3</span>
                </a>
             </li>

             <li>
                <a href="#" class="flex items-center p-2 text-slate-600 dark:text-slate-300 rounded-xl hover:bg-slate-100/80 dark:hover:bg-slate-700/50 transition-all group">
                   <div class="w-8 h-8 rounded-lg bg-amber-50 text-amber-600 dark:bg-amber-950/50 dark:text-amber-400 flex items-center justify-center text-xs group-hover:scale-110 group-hover:bg-amber-500 group-hover:text-white transition-all">
                     <i class="fa-solid fa-users"></i>
                   </div>
                   <span class="flex-1 ms-3 text-sm whitespace-nowrap">Usuarios</span>
                </a>
             </li>

             <li>
                <a th:href="@{/productos}" class="flex items-center p-2 text-slate-600 dark:text-slate-300 rounded-xl hover:bg-slate-100/80 dark:hover:bg-slate-700/50 transition-all group">
                   <div class="w-8 h-8 rounded-lg bg-rose-50 text-rose-600 dark:bg-rose-950/50 dark:text-rose-400 flex items-center justify-center text-xs group-hover:scale-110 group-hover:bg-rose-500 group-hover:text-white transition-all">
                     <i class="fa-solid fa-box-open"></i>
                   </div>
                   <span class="flex-1 ms-3 text-sm whitespace-nowrap">Productos</span>
                </a>
             </li>
          </ul>
        </div>

        <div>
          <p class="px-3 text-[11px] font-bold tracking-wider text-slate-400 uppercase dark:text-slate-500 mb-2">Ajustes</p>
          <ul class="space-y-1.5 font-medium">
             <li>
                <a href="#" class="flex items-center p-2 text-slate-600 dark:text-slate-300 rounded-xl hover:bg-slate-100/80 dark:hover:bg-slate-700/50 transition-all group">
                   <div class="w-8 h-8 rounded-lg bg-slate-100 text-slate-500 dark:bg-slate-700 dark:text-slate-400 flex items-center justify-center text-xs group-hover:scale-110 group-hover:bg-slate-700 group-hover:text-white transition-all">
                     <i class="fa-solid fa-gear"></i>
                   </div>
                   <span class="flex-1 ms-3 text-sm whitespace-nowrap">Configuración</span>
                </a>
             </li>
          </ul>
        </div>
      </div>
   </div>
</aside>

</body>
</html>
